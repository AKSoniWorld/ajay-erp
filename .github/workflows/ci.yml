name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build          # type-checks shared + api (and web once it exists)
      - run: npm test               # unit tests + end-to-end tests against an in-memory MongoDB replica set
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t ajay-api .
